<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance & Attendance Automation Suite</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.875rem;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            box-sizing: border-box;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }
        
        /* For webkit file upload button styling */
        input[type="file"]::file-selector-button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            color: var(--text-main);
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        input[type="file"]::file-selector-button:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--primary-hover);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.875rem;
            animation: fadeIn 0.3s ease-out;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }
        
        .download-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: var(--success);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .download-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Automation Suite</h1>
        <p class="subtitle">Upload your CSV files to generate the final report.</p>

        <form action="/generate" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="attendance_file">Attendance CSV File</label>
                <input type="file" name="attendance_file" id="attendance_file" accept=".csv,.xlsx,.xls" required>
            </div>
            
            <div class="form-group">
                <label for="marks_file">Marks CSV File</label>
                <input type="file" name="marks_file" id="marks_file" accept=".csv,.xlsx,.xls" required>
            </div>
            
            <button type="submit">Generate Report</button>
        </form>

        {% if error %}
        <div class="message error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="message success">
            {{ success }}<br>
            <a href="/download/{{ download_link }}" class="download-btn">Download Report</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
