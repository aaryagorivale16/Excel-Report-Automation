{% extends "base.html" %}

{% block title %}Teacher Portal Login | EduMetrics{% endblock %}

{% block content %}
<section class="chic-hero" style="min-height: 65vh; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div style="max-width: 480px; width: 100%; margin: 0 auto;">
        <div class="chic-card" style="box-shadow: var(--shadow-float); padding: 2.25rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-squircle" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h1 style="font-family: var(--font-title); font-size: 2rem; color: var(--color-text-dark); margin-bottom: 0.35rem;">
                    Teacher Portal <em>Login.</em>
                </h1>
                <p style="font-size: 0.875rem; color: var(--color-text-muted);">
                    Sign in to access your registered classes and generate academic reports.
                </p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div style="margin-bottom: 1.25rem;">
                    <label for="username" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-dark); margin-bottom: 0.4rem;">
                        Username or Email
                    </label>
                    <input type="text" name="username" id="username" class="chic-input" style="width: 100%;" placeholder="e.g. sarah_jenkins" required autofocus>
                </div>

                <div style="margin-bottom: 1.75rem;">
                    <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-dark); margin-bottom: 0.4rem;">
                        Password
                    </label>
                    <input type="password" name="password" id="password" class="chic-input" style="width: 100%;" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="pill-btn pill-btn-olive" style="width: 100%; padding: 0.9rem; font-size: 0.95rem;">
                    <span>Sign In to Portal</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </form>

            <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid rgba(167, 183, 198, 0.3); padding-top: 1.25rem;">
                <span style="font-size: 0.85rem; color: var(--color-text-muted);">New teacher?</span>
                <a href="{{ url_for('signup') }}" style="font-size: 0.85rem; font-weight: 600; color: var(--color-slate); text-decoration: underline; margin-left: 0.35rem;">
                    Create an account here
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
